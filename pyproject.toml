[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-ai-ml"
version = "0.1.0"
description = "Evidence-grounded PCB DRC intelligence: deterministic KiCad DRC + structured PCB representation + engineering RAG + tool-using LLM diagnosis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "sexpdata>=1.0.2",
    "pypdf>=4.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
pcb-ai = "pcb_ai.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
