server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy /api/* to the backend service, stripping the /api
    # prefix (the trailing "/" on both the location and proxy_pass URI
    # does this) -- mirrors what the Vite dev-server proxy does in
    # development (see ../vite.config.ts).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sample-board / uploaded-board first-run analysis makes several
        # live LLM calls and can take a few minutes end-to-end.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Client-side routing fallback (single-page app).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
